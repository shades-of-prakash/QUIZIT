services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
      target: backend
    environment:
      - NODE_ENV=production
      - MONGODB_URI=mongodb://mongodb:27017/QUIZIT
      - JWT_SECRET=${JWT_SECRET:-your_jwt_secret}
    depends_on:
      - mongodb
    expose:
      - "4000"
    volumes:
      - ./public/uploads:/usr/src/app/public/uploads
    networks:
      - app-network

  nginx:
    build:
      context: .
      dockerfile: Dockerfile
      target: frontend
    container_name: nginx-proxy
    ports:
      - "8080:8080"
    depends_on:
      - app
    volumes:
      - ./public/uploads:/usr/share/nginx/html/uploads
    networks:
      - app-network

  mongodb:
    image: mongo:latest
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
    networks:
      - app-network

networks:
  app-network:
    driver: bridge

volumes:
  mongodb_data:
